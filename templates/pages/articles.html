{{ define "articles" }}
    {{ template "base" . }}

    {{ block "title" . }}文章列表{{ end }}
    {{ block "content" . }}
        <h2>文章列表</h2>
        <ul>
            {{ range .Articles }}
                <li>{{ .Title }} - {{ .Date }}</li>
            {{ end }}
        </ul>
    {{ end }}
{{ end }}
